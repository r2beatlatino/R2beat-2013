# Las pruebas del server en cada PR y en cada push a develop / master. Sin el juego: lo que se puede
# probar en Linux (que compile, que arranque, que una cuenta entre como entra el juego, y que no se
# cuele nada prohibido). Un PR con una prueba en rojo no se fusiona (ver CONTRIBUIR.md).
name: pruebas

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:          # el botón «Run workflow» en la pestaña Actions

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: compila (todo el server y las herramientas)
        run: python -m compileall -q servidor herramientas pruebas correr_servidor.py jugar.py

      - name: arranca y una cuenta entra por la red, como el juego (con sus reveses)
        run: python pruebas/probar_login.py

      - name: antitrampa (reglas del cartel y que no se pague lo retenido)
        run: python pruebas/probar_antitrampa.py

      - name: antitrampa central (registro de eventos, telemetría de la dll, acciones y el tablero por HTTP)
        run: python pruebas/probar_antitrampa_central.py

      - name: multicuenta (tope de cuentas conectadas a la vez por IP)
        run: python pruebas/probar_multicuenta.py

      - name: máquina (huella de la PC, baneo y tope por PC, la MAC no se guarda)
        run: python pruebas/probar_maquina.py

      - name: nada prohibido (bases, cuentas, paks, IPs, rutas personales)
        run: python pruebas/probar_nada_prohibido.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: la imagen se arma (y adentro pasa la prueba del login)
        run: docker build -f despliegue/Dockerfile -t r2b2013-server:ci .

  # ★ 21-nov: la d3d9.dll. GitHub la compila desde el fuente y tiene que dar EXACTO la `exe/d3d9.dll` del commit
  #   (la receta es determinista). El server de PRUEBA reparte la dll de develop sólo si este paso dio verde: así lo
  #   que llega a la PC de los jugadores sale del fuente que se puede leer, no de un archivo armado aparte.
  dll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      # ★ 26-nov: bajarlo de ziglang.org en CADA corrida se colgaba (un curl sin plazo, 7+ min parado). Ahora: la caché
      #   (la guarda la primera corrida de develop y la usan todas las PR) y, si no está, espejos con plazo (los
  #   rápidos primero: ziglang.org daba ~300 KB/s). El sha256
      #   oficial manda igual: ningún espejo puede cambiar el compilador.
      - name: el compilador desde la caché (Zig 0.16.0)
        id: zig
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zig-x86_64-linux-0.16.0
          key: zig-0.16.0-linux-70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      - name: si no estaba, se baja (ziglang.org o un espejo, con su sha256 oficial)
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          F=zig-x86_64-linux-0.16.0.tar.xz
          for u in "https://zig.linus.dev/zig/$F" "https://pkg.machengine.org/zig/$F" "https://ziglang.org/download/0.16.0/$F" "https://fs.liujiacai.net/zigbuilds/$F"; do
            echo "→ $u"
            if curl -sSfL --connect-timeout 15 --max-time 120 --retry 1 -o zig.tar.xz "$u" && echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c; then
              tar xJf zig.tar.xz -C "$RUNNER_TEMP"
              exit 0
            fi
          done
          echo "::error::no se pudo bajar Zig 0.16.0 de ningún lado (o el sha256 no dio)"
          exit 1
      - name: el compilador listo
        run: |
          echo "ZIG=$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" version
      - name: el fuente da EXACTO la exe/d3d9.dll
        run: python herramientas/dll_d3d9/compilar.py --igual
      - name: la de prod (sin la isla de temporada) también compila
        run: python herramientas/dll_d3d9/compilar.py --prod
      - name: "el revés: una dll con un byte cambiado NO pasa"
        run: |
          cp exe/d3d9.dll "$RUNNER_TEMP/tocada.dll"
          python -c "import sys; p=sys.argv[1]; b=bytearray(open(p,'rb').read()); b[4096]^=0xFF; open(p,'wb').write(b)" "$RUNNER_TEMP/tocada.dll"
          if DLL_PUBLICADA="$RUNNER_TEMP/tocada.dll" python herramientas/dll_d3d9/compilar.py --igual; then
            echo "::error::la comprobación dejó pasar una dll tocada"; exit 1
          fi
