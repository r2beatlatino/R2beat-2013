; ============================================================================
;  ★ EL CARTEL DE METRICAS   -   20-sep-2026
;
;  el autor: "dxvk da metricas, nuestro d3d9 no da ni un aviso de fps".
;  Ahora si: un numero de fps y un grafico de tiempos de cuadro, dibujados con
;  `Clear` y una lista de rectangulos. Sin fuentes, sin shaders, sin texturas.
;
;  ⚠ DIBUJA ENCIMA DEL JUEGO y cuesta un poquito. Se enciende para medir, no
;    para jugar. Igual que el HUD de DXVK.
;
;  COMO SE LEE EL GRAFICO: cada barra es un cuadro. La barra LLENA = 33 ms
;  (o sea 30 fps). Parejo y bajo = bien. Una barra que salta al techo es un
;  TIRON — y eso es lo que el ojo castiga, no el promedio.
; ============================================================================
[metricas]
; 0 = apagado  ·  1 = el cartel en pantalla
activo=0
; tamaño de los digitos (1 a 12)
escala=3
; 1 = ademas el grafico de tiempos de cuadro debajo del numero
grafico=1
prueba=0

; ============================================================================
;  ★★★ EL MOTOR, desde la DLL   -   20-sep-2026
;
;  Hasta hoy esto lo ponia Frida, que un jugador no tiene. Ahora lo hace la dll,
;  que carga ANTES del bucle del juego y puede escribir su codigo en memoria.
;  ⇒ Sin tocar el .exe y sin cueva en el binario: se revierte borrando la dll.
; ============================================================================
[motor]
; cuanto duerme el bucle por vuelta. 16 = de fabrica.
sleep=1

; cuanto duerme al PERDER EL FOCO. 1000 = de fabrica (y corre DOS veces seguidas).
siesta=20

; ★ por debajo de estos Hz, el decouple NO se aplica.
;   MEDIDO: a 60 Hz el motor pasa de 60 a 51 pasos/s con el decouple puesto (-15%),
;   porque cada vuelta dibuja y dibujar bloquea en el vsync. A 120/165 sobra margen.
;   A 60 el decouple ademas no aporta nada: el motor ya entrega 60 imagenes.
hzminimo=61

; ★ el decouple. Solo entran si el monitor supera `hzminimo`.
;   gate  = dibujar en CADA vuelta del bucle (0x004989B8)
;   mundo = el update-gate: el mundo sigue en sus 60 pasos (0x004989E8, cueva propia)
gate=0
mundo=0

; ★★★ LA ESPERA PRECISA. El motor despierta en el instante JUSTO del proximo paso,
;   en vez de cuando Windows quiera.
;   ⛔ De ella depende que sea seguro bajar el `sleep`: con sleep bajo y esto APAGADO
;      el juego da TIRONES (medido el 20-sep en el launcher offline). La dll se niega
;      a bajar el sleep si esto esta en 0.
ritmo=1
; decimas de ms del tramo final esperado A MANO. 15 = 1,5 ms. ⚠ girar quema CPU.
giro=15
fluidez=1
