; ============================================================================
;  PRUEBA 2  -  LA CADENA:  nuestro proxy  ->  DXVK      20-sep-2026, noche
;
;  ⛔ EL HALLAZGO: el 2013 pide `SwapEffect = COPY` y `LOCKABLE_BACKBUFFER`.
;     COPY significa "conserva el backbuffer al presentar", y un flip lo ENTREGA.
;     ⇒ COPY prohibe el flip POR DEFINICION. Por eso en ventana salia siempre
;       `Composed: Copy with GPU GDI` por mucho que se limpiara Windows: el
;       apagador estaba adentro del CreateDevice del juego.
;
;  ★ Nosotros reescribimos ese campo a DISCARD (es lo que permite el MSAA 8x).
;    Y DXVK es el que convierte un DISCARD en un flip de verdad, por Vulkan.
;    Hasta hoy no se podian tener los dos: se peleaban el nombre `d3d9.dll`.
; ============================================================================

[video]
; ★★★ LA CADENA. En vez del d3d9 del sistema, cargamos DXVK.
;     Tiene que estar en ESTA misma carpeta.

; MSAA 8x: ademas de verse mejor, es lo que OBLIGA a DISCARD + no-LOCKABLE,
; que es justo lo que esta prueba necesita.
msaa=8
altenter=1
activo=1
log=1
titulo=1
real=

[moderno]
; ⛔ 9Ex APAGADO: mata al juego en el cuadro 0 (violacion de acceso al escribir
;    0x0 en R2Beat_local.exe+0x35dcec). Y `pool=1` NO era el arreglo: murio con
;    1 MANAGED pedido, 1 traducido, 0 fallados. Esa hipotesis queda cerrada.
;    ⇒ Y ya no hace falta: el flip lo pone DXVK, no 9Ex.
d3d9ex=0
flipex=0
pool=0

[plano]
